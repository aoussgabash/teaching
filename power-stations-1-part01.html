<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محطات الطاقة الكهربائية 1 — الجزء الأول</title><style>html,body{margin:0;height:100%;background:#071321;color:#fff;font-family:Tahoma,Arial,sans-serif}iframe{width:100%;height:100%;border:0;display:block}#actions{position:fixed;bottom:12px;left:12px;z-index:30;display:flex;gap:8px}#actions button{background:#155e75;color:white;border:1px solid #38bdf8;border-radius:9px;padding:9px 14px;font:inherit;cursor:pointer}@media print{#actions{display:none}}</style></head><body><div id="actions"><button type="button" id="print">PDF | طباعة</button><button type="button" id="top">↑ أعلى الصفحة</button></div><iframe id="lesson" title="محطات الطاقة الكهربائية 1 — الجزء الأول" src="electrical-power-plants-1-lecture01.html"></iframe><script>
document.getElementById('lesson').addEventListener('load',function(){const d=this.contentDocument;if(!d)return;const ext=d.getElementById('power-history-extension');const timeline=d.querySelector('.timeline');if(!ext||!timeline)return;
const entries=[['1881','بدايات الإمداد العام بالكهرباء | Early public electricity supply','بدأت غودالمينغ في بريطانيا توفير الكهرباء للإنارة باستخدام توليد كهرمائي. يختلف وصف «الأولى» حسب معيار المقارنة.'],['1882','محطة بيرل ستريت | Pearl Street Station','افتتحت في نيويورك في 4 سبتمبر 1882 بوصفها نموذجا مبكرا لمحطة توليد مركزية تجارية بالتيار المستمر.'],['1882','ميسباخ–ميونخ | Miesbach–Munich','تجربة لنقل الكهرباء بالتيار المستمر لمسافة تقارب 57 km، وبتوتر يقارب 2 kV.'],['1891','لاوفن–فرانكفورت | Lauffen–Frankfurt','نقل الطاقة ثلاثية الطور لمسافة نحو 175 km وبتوتر يقارب 15 kV، ما برهن على جدوى النقل المتناوب لمسافات بعيدة.'],['1950–2000','الشبكات المترابطة | Interconnected Grids','تطور الربط بين المحطات، ورفع توترات النقل، والحماية الرقمية، والتحكم المركزي.'],['2000–2026','الشبكات الذكية | Smart Power Systems','الطاقة المتجددة، البطاريات، HVDC، محطات التحويل الرقمية، والصيانة التنبؤية.']];
const old=[...timeline.querySelectorAll(':scope > .event')];for(const [year,title,description] of entries){const node=d.createElement('div');node.className='event';node.innerHTML='<div class="year">'+year+'</div><div class="card"><strong>'+title+'</strong><p class="ar" lang="ar" dir="rtl">'+description+'</p></div>';const first=old.find(e=>{const m=e.querySelector('.year')?.textContent.match(/\d{4}/);return m&&Number(m[0])>parseInt(year)});if(first)timeline.insertBefore(node,first);else timeline.appendChild(node)}
const h=d.querySelector('.hero h1');if(h)h.textContent='From Amber to Al-Dablan: The Evolution of Electrical Power Stations';const ar=d.querySelector('.hero .ar');if(ar)ar.textContent='من الكهرمان إلى الدبلان: تاريخ الكهرباء وتطور محطات الطاقة';const muted=d.querySelector('.hero .muted');if(muted)muted.textContent='Electrical Power Plants I | محطات الطاقة الكهربائية 1';const back=d.querySelector('header nav a[href="electrical-fundamentals-1.html"]');if(back){back.href='index.html';back.textContent='← المقررات | Courses'};ext.remove();d.title='محطات الطاقة الكهربائية 1 — الجزء الأول';});
document.getElementById('print').addEventListener('click',()=>{const f=document.getElementById('lesson');f.contentWindow?.print()});document.getElementById('top').addEventListener('click',()=>{const f=document.getElementById('lesson');f.contentWindow?.scrollTo({top:0,behavior:'smooth'})});</script></body></html>
