<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">Bidirectional power flow with renewable generation and battery storage</title><desc id="d">Conceptual diagram based on the A-R-OPF research: upstream and downstream distribution networks with wind, PV, battery storage, curtailment, import forward flow and export reverse flow.</desc><defs><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#159447"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6Z" fill="#d9534f"/></marker></defs><rect width="1200" height="360" rx="20" fill="#f7fafc"/><text x="600" y="38" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#16324f">Renewables + Battery Storage → Bidirectional Distribution Network</text><text x="600" y="68" text-anchor="middle" font-family="Arial" font-size="20" fill="#445">الطاقة المتجددة + التخزين → شبكة توزيع ثنائية اتجاه تدفق الاستطاعة</text><ellipse cx="310" cy="205" rx="180" ry="78" fill="#e8edf2" stroke="#8aa0b4" stroke-width="3"/><ellipse cx="890" cy="205" rx="180" ry="78" fill="#e8edf2" stroke="#8aa0b4" stroke-width="3"/><text x="310" y="198" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Upstream Network</text><text x="310" y="230" text-anchor="middle" font-family="Arial" font-size="20">الشبكة العليا</text><text x="890" y="198" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700">Downstream Network</text><text x="890" y="230" text-anchor="middle" font-family="Arial" font-size="20">الشبكة الدنيا</text><line x1="490" y1="205" x2="710" y2="205" stroke="#34495e" stroke-width="5"/><line x1="600" y1="184" x2="700" y2="184" stroke="#159447" stroke-width="9" marker-end="url(#g)"/><text x="650" y="163" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#159447">Import / Forward</text><line x1="600" y1="226" x2="500" y2="226" stroke="#d9534f" stroke-width="9" marker-end="url(#r)"/><text x="550" y="257" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#d9534f">Export / Reverse</text><g font-family="Arial" font-size="42"><text x="235" y="128">🌬</text><text x="300" y="128">🔋</text><text x="365" y="128">☀</text><text x="815" y="128">🌬</text><text x="880" y="128">🔋</text><text x="945" y="128">☀</text></g><g font-family="Arial" font-size="18" font-weight="700" fill="#c0392b"><text x="300" y="98" text-anchor="middle">Curtailment ↑</text><text x="880" y="98" text-anchor="middle">Curtailment ↑</text></g><text x="600" y="320" text-anchor="middle" font-family="Arial" font-size="19" fill="#334">A-R-OPF coordinates active/reactive power, renewable generation and BSS under network constraints.</text><text x="600" y="346" text-anchor="middle" font-family="Arial" font-size="18" fill="#334">ينسّق A-R-OPF الاستطاعتين الفعالة والردية والتوليد المتجدد والتخزين ضمن قيود الشبكة.</text></svg>